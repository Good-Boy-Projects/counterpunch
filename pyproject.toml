[build-system]
requires = ["setuptools>=68", "wheel", "setuptools_scm"]
build-backend = "setuptools.build_meta"

[project]
name = "counterpunch"
description = "Counterpunch, a UFO-native font editor for macOS and Linux."
readme = "README.rst"
license = { text = "GNU LGPL v3/GNU GPL v3" }
authors = [{ name = "Adrien Tétar", email = "adri-from-59@hotmail.fr" }]
urls = { Homepage = "https://github.com/Good-Boy-Projects/counterpunch" }
requires-python = ">=3.11"          # was >=3.6 — bumping to match our target floor
dynamic = ["version"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
    "Topic :: Text Processing :: Fonts",
]

dependencies = [
    "booleanOperations>=0.9.0",       # was >=0.7.0
    "defcon>=0.10.3",                 # was >=0.6.0
    "fonttools[unicode,ufo,lxml,type1,woff]>=4.53.0",  # was >=4.0.0
    "hsluv>=5.0.4",                   # was >=0.0.2 (old version predates the real PyPI release)
    "ufo-extractor>=0.8.1",           # PyPI name stays "ufo-extractor"; import name is "extractor"
    "ufo2ft>=3.0.0",                  # was >=0.5.3
    "PySide6>6.7.0",
]

[project.optional-dependencies]
macos = ["pyobjc-framework-cocoa>=10.0"]  # was >=6.2, sys_platform=='darwin' guard moved below
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "flake8>=7.0",
    "isort>=5.13",
    "black>=24.0",
]

[project.gui-scripts]
counterpunch = "counterpunch.__main__:main"

[tool.setuptools]
package-dir = { "" = "Lib" }

[tool.setuptools.packages.find]
where = ["Lib"]

[tool.setuptools_scm]
# replaces the old setup_requires=setuptools_scm entry — version now derived
# from git tags automatically, no change in behavior, just the modern config location

[tool.black]
target-version = ["py311", "py312"]  # was ["py36"]
line-length = 88

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
line_length = 88

[tool.flake8]
ignore = ["E203", "W503", "E501", "B009", "B010", "B305", "B006", "B008"]
max-line-length = 88
max-complexity = 45
exclude = [".git", "icons_db.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
